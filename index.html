<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학여행 자유 탐색 미션</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app-container">
    
    <!-- 1. 로그인 화면 -->
    <section id="login-section" class="screen">
      <div class="login-card">
        <div class="app-badge">🌱 2026년 새움중학교 2학년</div>
        <h2>수학여행 자유관람 미션</h2>
        <p>학번, 이름, 비밀번호를 입력해 주세요.</p>
        <form id="login-form">
          <input type="number" id="input-id" placeholder="학번" required>
          <input type="text" id="input-name" placeholder="이름" required>
          <input type="password" id="input-password" placeholder="비밀번호 (초기: 1234)" required>
          <button type="submit" id="btn-login">탐색 시작하기 🚀</button>
        </form>
      </div>
    </section>

    <!-- 2. 메인 대시보드 화면 -->
    <section id="main-section" class="screen hidden">
      <!-- 상단 프로필 및 점수 헤더 -->
      <header class="user-header">
        <div class="user-info">
          <div class="user-name-box">
            <span id="user-display">20101 홍길동</span>
            <div class="user-team-wrapper">
              <span id="user-team-tag" class="badge">A</span>
              <span class="team-label">조</span>
            </div>
          </div>
          <div class="header-btns">
            <button id="btn-open-pw-modal" class="btn-sm btn-pw-change" type="button">비밀번호 변경</button>
            <button id="btn-logout" class="btn-sm btn-logout" type="button">로그아웃</button>
          </div>
        </div>
        <div class="score-box">
          [ <span id="user-score" class="score">0</span> / <span id="total-possible-score" class="score-total">0</span> 점 ]
        </div>
      </header>

      <!-- 장소 탭 (3개 장소) -->
      <nav class="location-tabs">
        <button class="tab-btn active" data-location="장소A" type="button">📍 장소 A</button>
        <button class="tab-btn" data-location="장소B" type="button">📍 장소 B</button>
        <button class="tab-btn" data-location="장소C" type="button">📍 장소 C</button>
      </nav>

      <!-- 미션 리스트 영역 -->
      <main class="mission-list-container">
        <div id="mission-list">
          <!-- 미션 카드들이 JavaScript로 동적 추가됩니다 -->
        </div>
      </main>
    </section>

  </div>

  <!-- 모달 1: 미션 제출 창 -->
  <div id="mission-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">미션 제목</h3>
      <p id="modal-desc">미션 설명이 들어갑니다.</p>
      
      <div class="input-group">
        <input type="text" id="modal-answer" placeholder="정답 또는 인증 내용을 입력하세요">
      </div>

      <div class="modal-actions">
        <button id="btn-modal-close" class="btn-secondary" type="button">취소</button>
        <button id="btn-modal-submit" class="btn-primary" type="button">제출하기</button>
      </div>
    </div>
  </div>

  <!-- 모달 2: 비밀번호 변경 창 -->
  <div id="pw-modal" class="modal hidden">
    <div class="modal-content">
      <h3>🔒 비밀번호 변경</h3>
      <p>초기 비밀번호(1234)를 본인만의 비밀번호로 바꿔주세요.</p>
      
      <div class="input-group">
        <input type="password" id="input-curr-pw" placeholder="현재 비밀번호">
        <input type="password" id="input-new-pw" placeholder="새 비밀번호 (4자리 이상)">
        <input type="password" id="input-new-pw-confirm" placeholder="새 비밀번호 확인">
      </div>

      <div class="modal-actions">
        <button id="btn-pw-close" class="btn-secondary" type="button">취소</button>
        <button id="btn-pw-submit" class="btn-primary" type="button">변경하기</button>
      </div>
    </div>
  </div>

  <!-- 스크립트 연결 -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
